<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>シフト提出カレンダー</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}body{background-color:#f8f9fa;display:flex;justify-content:center;padding:0;min-height:100vh}.app-container{width:100%;max-width:400px;background-color:#fff;min-height:100vh;border:1px solid #e0e0e0;box-shadow:0 4px 12px rgba(0,0,0,.05)}.top-bar{background-color:#1a1a1a;color:#fff;padding:14px 16px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:12px}.calendar-card{margin:12px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);background-color:#fff;overflow:hidden;border:1px solid #f0f0f0}.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #f0f0f0}.header-icons-left{display:flex;gap:12px;align-items:center;color:#333}.title{font-size:17px;font-weight:700}.submit-btn{color:#28a745;font-weight:700;font-size:15px;cursor:pointer}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:12px 0 6px 0;font-size:13px;color:#666}.weekdays .sun{color:#e53935}.weekdays .sat{color:#1e88e5}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;padding:0 6px 12px 6px}.day-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;height:48px;cursor:pointer;font-size:15px;position:relative;user-select:none;border-radius:6px}.day-cell.other-month{color:#ccc}.day-cell.sun{color:#e53935}.day-cell.sat{color:#1e88e5}.day-cell.selected{background-color:#d4edda!important;font-weight:700;color:#000!important}.dot{width:5px;height:5px;background-color:#28a745;border-radius:50%;margin-top:3px}.date-header{background-color:#f8f9fa;padding:12px 16px;font-size:14px;font-weight:700;color:#333;border-top:1px solid #e0e0e0;border-bottom:1px solid #e0e0e0}.shift-details{padding:16px;background-color:#fff}.shift-card{display:flex;align-items:center;gap:12px;margin-bottom:20px}.shift-time{font-size:14px;color:#333;line-height:1.2;text-align:right}.shift-bar{width:4px;height:36px;background-color:#28a745;border-radius:2px}.shift-title{font-size:18px;font-weight:700}.add-shift-btn{display:flex;justify-content:center;align-items:center;gap:6px;width:100%;padding:12px;border:1px dashed #ccc;border-radius:6px;color:#28a745;font-weight:700;font-size:14px;cursor:pointer;background-color:#fff}</style><script>document.addEventListener("DOMContentLoaded",function(){const e=["日","月","火","水","木","金","土"],t=document.querySelectorAll(".day-cell"),n=document.getElementById("selectedDateText");t.forEach(c=>{c.addEventListener("click",function(){t.forEach(e=>e.classList.remove("selected")),this.classList.add("selected");const o=this.getAttribute("data-date");if(!o)return;const[a,l,d]=o.split("-").map(Number),s=e[new Date(a,l-1,d).getDay()];n.textContent=${a}年${l}月${d}日 (${s})})})});</script></head><body><div class="app-container"><div class="top-bar"><span>< シフト提出カレンダー</span></div><div class="calendar-card"><div class="header"><div class="header-icons-left"><span>☰</span><span>↑</span></div><div class="title">2026年8月 ⚙</div><div class="submit-btn">シフト提出</div></div><div class="weekdays"><div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div></div><div class="calendar-grid" id="calendarGrid"><div class="day-cell other-month sun" data-date="2026-07-26">26</div><div class="day-cell other-month" data-date="2026-07-27">27</div><div class="day-cell other-month" data-date="2026-07-28">28</div><div class="day-cell other-month" data-date="2026-07-29">29</div><div class="day-cell other-month" data-date="2026-07-30">30</div><div class="day-cell other-month" data-date="2026-07-31">31</div><div class="day-cell sat" data-date="2026-08-01">1<div class="dot"></div></div><div class="day-cell sun" data-date="2026-08-02">2<div class="dot"></div></div><div class="day-cell" data-date="2026-08-03">3</div><div class="day-cell" data-date="2026-08-04">4<div class="dot"></div></div><div class="day-cell" data-date="2026-08-05">5</div><div class="day-cell" data-date="2026-08-06">6<div class="dot"></div></div><div class="day-cell" data-date="2026-08-07">7</div><div class="day-cell sat" data-date="2026-08-08">8</div><div class="day-cell sun" data-date="2026-08-09">9</div><div class="day-cell" data-date="2026-08-10">10<div class="dot"></div></div><div class="day-cell" data-date="2026-08-11">11</div><div class="day-cell selected" data-date="2026-08-12">12<div class="dot"></div></div><div class="day-cell" data-date="2026-08-13">13</div><div class="day-cell" data-date="2026-08-14">14<div class="dot"></div></div><div class="day-cell sat" data-date="2026-08-15">15</div><div class="day-cell sun" data-date="2026-08-16">16</div><div class="day-cell" data-date="2026-08-17">17<div class="dot"></div></div><div class="day-cell" data-date="2026-08-18">18</div><div class="day-cell" data-date="2026-08-19">19<div class="dot"></div></div><div class="day-cell" data-date="2026-08-20">20</div><div class="day-cell" data-date="2026-08-21">21<div class="dot"></div></div><div class="day-cell sat" data-date="2026-08-22">22</div><div class="day-cell sun" data-date="2026-08-23">23</div><div class="day-cell" data-date="2026-08-24">24<div class="dot"></div></div><div class="day-cell" data-date="2026-08-25">25</div><div class="day-cell" data-date="2026-08-26">26<div class="dot"></div></div><div class="day-cell" data-date="2026-08-27">27</div><div class="day-cell" data-date="2026-08-28">28<div class="dot"></div></div><div class="day-cell sat" data-date="2026-08-29">29</div><div class="day-cell sun" data-date="2026-08-30">30</div><div class="day-cell" data-date="2026-08-31">31<div class="dot"></div></div><div class="day-cell other-month" data-date="2026-09-01">1</div><div class="day-cell other-month" data-date="2026-09-02">2</div><div class="day-cell other-month" data-date="2026-09-03">3</div><div class="day-cell other-month" data-date="2026-09-04">4</div><div class="day-cell other-month sat" data-date="2026-09-05">5</div></div></div><div class="date-header" id="selectedDateText">2026年8月12日 (水)</div><div class="shift-details"><div class="shift-card"><div class="shift-time">15:00<br>18:00</div><div class="shift-bar"></div><div class="shift-title">ホール</div></div><button class="add-shift-btn">＋ シフトを追加</button></div></div></body></html>
